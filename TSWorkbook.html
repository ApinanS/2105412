<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woods Troubleshooting Workbook v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A47;--ink:#1F2933;--muted:#5F6B7A;--line:#DCE2EA;--card:#F5F7FA;--bg:#FFFFFF;--red:#C8102E;--blue:#1F5FA8;--green:#1E8449;--orange:#D9822B;--amber:#F2C14E;--sel:#EEF3FA;
  --font:'Montserrat','Prompt','Leelawadee UI','Tahoma',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
#app{display:grid;grid-template-columns:262px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff}
header .brand{font-weight:800;letter-spacing:.02em;font-size:16px;white-space:nowrap}
header .brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
header .ptitle{flex:1;min-width:0;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
header .hbtn:hover{background:rgba(255,255,255,.22)}
#saveState{font-size:12px;opacity:.8;white-space:nowrap}
#timer{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px 6px}
#timer .face{font-weight:800;font-size:17px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
#timer.warn .face{color:var(--amber)}#timer.done .face{color:#FF7A7A}
#timer button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;font-size:11px;padding:2px 5px;cursor:pointer}
nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 30px}
nav .grp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:600;font-size:14px}
nav a:hover{background:#E9EEF4}nav a.on{background:var(--navy);color:#fff}
nav a .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);font-weight:800;font-size:12px;flex:0 0 26px}
nav a.on .no{background:var(--red);border-color:var(--red);color:#fff}
nav a .pg{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}nav a.on .pg{color:#cfd8e3}
nav a .bar{display:block;height:3px;background:#E1E6EC;border-radius:2px;margin-top:3px;overflow:hidden}nav a .bar i{display:block;height:100%;background:var(--green)}
nav a.on .bar{background:rgba(255,255,255,.25)}
nav .nl{flex:1;min-width:0}
main{overflow-y:auto;padding:22px 30px 80px}
#otsPane{grid-column:2;grid-row:2;display:none;flex-direction:column;min-height:0}#otsPane .otsbar{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}#otsFrame{flex:1;width:100%;border:0;background:#fff}
.wrap{max-width:1240px;margin:0 auto}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 4px}
h1{font-size:28px;margin:0 0 6px;color:var(--navy)}h2{font-size:21px;color:var(--navy);margin:0}h3{font-size:16.5px;color:var(--navy);margin:14px 0 6px}
.gq{font-size:20px;font-weight:700;color:var(--red);margin:4px 0 14px;line-height:1.3}
.thg{display:block;font-family:'Prompt',var(--font);font-weight:400;font-size:13.5px;color:var(--muted);margin-top:2px}
.stagecard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stagecard>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stagecard h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stagecard ul{margin:0;padding-left:18px}.stagecard li{margin:2px 0;font-size:14px}
.stagecard .out{border-top:4px solid var(--green)}.stagecard .what{border-top:4px solid var(--blue)}.stagecard .obj{border-top:4px solid var(--red)}
.substrip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.substrip a{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;cursor:pointer}
.substrip a.key{border-color:#E7A1AC}.substrip a.done{background:#EAF6EE;border-color:var(--green);color:var(--green)}
.sub{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px 16px 14px;margin:0 0 14px;background:#fff}
.sub.key{border-left-color:var(--red)}
.sub .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sub .sn{font-weight:800;color:var(--blue);font-size:14px}.sub.key .sn{color:var(--red)}
.sub .st{font-weight:700;color:var(--navy);font-size:17px}
.sub .tick{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}.sub .tick.ok{color:var(--green)}
.sub .hint{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.fld{margin:8px 0}.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
textarea{min-height:64px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.chk input{width:18px;height:18px}
table.ed{width:100%;border-collapse:collapse;margin:4px 0}
table.ed th{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 5px;border-bottom:2px solid var(--navy);white-space:nowrap}
table.ed td{padding:3px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.ed td input,table.ed td select,table.ed td textarea{padding:4px 6px;font-size:13.5px;border-width:1px}
table.ed td textarea{min-height:34px}
table.ed td.x{width:28px;text-align:center}
table.ed td.cv{font-weight:700;color:var(--navy);padding-top:8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:7px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--sel)}.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:#1b3d63}
.btn.red{border-color:var(--red);color:var(--red)}.btn.sm{padding:2px 8px;font-size:12px}.btn.ghost{border-color:var(--line);color:var(--muted)}
.del{border:none;background:none;color:#B0B8C4;cursor:pointer;font-size:16px;line-height:1}.del:hover{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.note{font-size:13px;color:var(--muted)}.warn{background:#FFF6E5;border:1px solid #F2C98B;border-radius:8px;padding:7px 11px;font-size:13.5px;margin:6px 0}
.okbox{background:#EAF6EE;border:1px solid #A9D8B8;border-radius:8px;padding:7px 11px;font-size:13.5px;margin:6px 0}
.casebox{background:#FFF8EE;border:1.5px solid #F2C98B;border-radius:10px;padding:10px 14px;margin:6px 0}
.casebox b.code{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--navy)}
.pill.S{background:#EAF6EE;color:var(--green);border-color:#A9D8B8}.pill.D{background:#FDF1F1;color:var(--red);border-color:#EDB0B9}.pill.N{color:var(--muted)}
.tier1{color:#fff;background:var(--red);border-color:var(--red)}.tier2{color:#fff;background:var(--orange);border-color:var(--orange)}.tier3{color:#fff;background:#8A96A6;border-color:#8A96A6}
.st-Killed{color:var(--red);font-weight:700}.st-Confirmed{color:var(--green);font-weight:700}.st-Survives{color:var(--blue);font-weight:700}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff}
.card.test{border-left:5px solid var(--orange)}
.card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.card .ch b.tid{font-size:15px;color:var(--orange)}
.card .ch .ttl{font-weight:700;color:var(--navy);flex:1;min-width:200px}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:190px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chips span{font-size:12px;padding:2px 8px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.chips span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop{border:2px dashed #B6C2D2;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--card)}
.drop.over{border-color:var(--blue);background:var(--sel)}
.ds{display:grid;grid-template-columns:70px 1fr 120px 150px 120px 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kind{font-size:11px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:5px;color:#fff;text-align:center}
.kind.run{background:var(--blue)}.kind.snapshot{background:var(--green)}.kind.log{background:var(--orange)}
.cand{display:grid;grid-template-columns:24px 1fr 110px;gap:8px;align-items:start;padding:5px 0;border-bottom:1px dashed var(--line)}
.cand textarea{min-height:36px;font-size:13.5px}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.fig{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.fig .cap{display:flex;gap:6px;margin-top:5px}
.sdn td.c select{width:52px;padding:3px;text-align:center;font-weight:800}
.sdn td.c select.S{background:#EAF6EE;color:var(--green)}.sdn td.c select.D{background:#FDF1F1;color:var(--red)}
.sdn th.ev{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;max-height:150px;font-size:11px}
.fish{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto}
.sk-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.sk-tools .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sk-tools .sw.on{box-shadow:0 0 0 2.5px var(--navy)}
#skc{width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;touch-action:none;background:#fff}
.chk-list .ck{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ck .b{width:22px;height:22px;border-radius:5px;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:0 0 22px}
.ck.ok .b{background:var(--green);border-color:var(--green)}.ck.ok .b::after{content:'\2713'}
.deliv{border:2px solid var(--green);border-radius:12px;padding:12px 16px;margin-top:20px;background:#F6FBF7}
.deliv h3{margin-top:0;color:var(--green)}
.hero{background:linear-gradient(135deg,var(--navy),#1F4E79);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:16px}
.hero h1{color:#fff}.hero p{margin:6px 0 0;opacity:.9}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.out-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.out-card h3{margin-top:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:9px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.calc>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc h4{margin:0 0 6px;font-size:13.5px;color:var(--navy)}
.calc .r{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.calc .ans{font-weight:800;color:var(--green);font-size:15px;margin-top:6px}
.pfdimg{width:100%;max-width:980px;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:#fff;border-radius:12px;max-width:96vw;max-height:94vh;overflow:auto;padding:12px}
.vtag{font-weight:800;color:var(--navy)}
.mono{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0}
.tabs a{padding:7px 14px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--navy);border-bottom-color:var(--red)}
@media (max-width:900px){#app{grid-template-columns:1fr}nav{display:none}#otsPane{grid-column:1}.stagecard,.g2,.g3,.g4,.calc{grid-template-columns:1fr}}
@media print{#app{display:block;height:auto}header,nav{display:none}main{overflow:visible}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand">Woods Troubleshooting Workbook <span style="font-weight:600;opacity:.7">v2</span><small>Six-stage problem solving · OTS workshop</small></div>
  <div class="ptitle" id="ptitle"></div>
  <span id="saveState"></span>
  <div id="timer" title="Workshop timer"><span class="face">--:--</span><button data-min="3">3</button><button data-min="5">5</button><button data-min="10">10</button><button data-min="15">15</button><button data-min="0">■</button></div>
  <button class="hbtn" data-act="reset" title="Clear the workbook and start again">⟲ Reset</button>
  <button class="hbtn" data-act="open">Open</button>
  <button class="hbtn" data-act="save" title="Ctrl+S">Save</button>
  <button class="hbtn" data-act="go" data-v="out">Report / Slides</button>
 </header>
 <nav id="nav"></nav>
 <main id="main"></main>
 <section id="otsPane"><div class="otsbar"><b>OTS (live)</b><span id="otsName" class="note" style="flex:1"></span><span class="note">CSV from the OTS Data export → <a data-act="go" data-v="data" style="cursor:pointer;color:var(--blue)">OTS data &amp; evidence</a> · keeps running while you switch pages</span><button class="btn sm" data-act="otsreload">Reload</button><a id="otsNew" class="btn sm" target="_blank" rel="noopener">New tab ↗</a></div><iframe id="otsFrame" title="Operator training simulator" allow="fullscreen; clipboard-write"></iframe></section>
</div>
<input type="file" id="fileOpen" accept=".json,.woods.json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" multiple hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileOts" accept=".html,.htm,.svg,.png,.jpg,.jpeg" multiple hidden>
<input type="file" id="fileDraw" accept=".svg,.png,.jpg,.jpeg,.webp" hidden>
<div class="toast" id="toast"></div>
<script>
const PACKS = {"cu_parallel_pump_station_ver_1": {"id": "cu_parallel_pump_station_ver_1", "name": "Parallel Pump Station (P-200A/B)", "src": "index.html", "tags": {"FI-199": {"u": "L/s", "desc": "Tank-farm transfer into T200 (set by HIC-199 at the tank farm)", "r": [0, 20]}, "LI-200": {"u": "%", "desc": "T200 feed storage level (10 m tank, Ø 12 m; 10 % = 1 m)", "r": [0, 100]}, "LSLL-200": {"u": "%", "desc": "T200 low-low level switch: trips both feed pumps (10 %, 5 s)", "r": [0, 100]}, "II-210": {"u": "A", "desc": "Motor current of pump A (MCC); full-load current 18.9 A, overload trip 21.7 A", "r": [0, 30]}, "II-220": {"u": "A", "desc": "Motor current of pump B (MCC); full-load current 18.9 A, overload trip 21.7 A", "r": [0, 30]}, "TI-212": {"u": "°C", "desc": "Pump A casing temperature (TSHH-212 trips the motor at 110 °C)", "r": [20, 130]}, "TI-222": {"u": "°C", "desc": "Pump B casing temperature (TSHH-222 trips the motor at 110 °C)", "r": [20, 130]}, "TI-110": {"u": "°C", "desc": "Feed after preheater E-100, to D-150", "r": [0, 250]}, "PI-111": {"u": "bar g", "desc": "E-100 shell (steam) pressure", "r": [0, 12]}, "FI-112": {"u": "t/h", "desc": "Steam to E-100", "r": [0, 8]}, "LI-150": {"u": "%", "desc": "Cat-cracker feed drum D-150 level (30 m³)", "r": [0, 100]}, "LSHH-150": {"u": "%", "desc": "D-150 high-high level: forces V100 closed (95 %)", "r": [0, 100]}, "FI-151": {"u": "L/s", "desc": "Cat-cracker charge drawn from D-150", "r": [0, 20]}, "PI-210": {"u": "m", "desc": "Pump A discharge gauge (local, between pump and check valve): reads the casing, in metres of liquid", "r": [-10, 60]}, "PI-220": {"u": "m", "desc": "Pump B discharge gauge (local, between pump and check valve): reads the casing, in metres of liquid", "r": [-10, 60]}, "PI-209": {"u": "m", "desc": "Common suction header gauge (local), metres of liquid", "r": [-10, 20]}, "PIT-210": {"u": "m", "desc": "Rev C: pump A casing pressure transmitter (PAH-210 when A is idle and above 8 m)", "r": [-10, 60]}, "PIT-220": {"u": "m", "desc": "Rev C: pump B casing pressure transmitter (PAH-220 when B is idle and above 8 m)", "r": [-10, 60]}, "MARGIN": {"u": "$/h", "desc": "Operating cost/penalty rate (energy display)", "r": [-3000, 0]}, "FRC-100": {"u": "L/s", "desc": "Feed flow to the cat cracker (FE-100) → V100 (fail closed)", "r": [0, 20]}, "TIC-110": {"u": "°C", "desc": "Preheater E-100 outlet → steam valve TV-110 (fail closed)", "r": [0, 250]}, "HIC-199": {"u": "%", "desc": "Tank-farm transfer to T200 (hand controller at the tank farm)", "r": [0, 100]}}, "te": [{"code": "TE-1", "title": "The lazy twin", "sit": "Pump A is usually running; pump B, identical to A, is the spare. FRC-100 shows that not enough feed is going to the cat cracker although its output is at 100 %. Last week the operators switched from A to B and the flow came back. Pump B is scheduled for maintenance next week, so A must deliver. What is wrong?"}, {"code": "TE-2", "title": "Short of feed whichever pump runs", "sit": "Over the last hour FRC-100 has drifted low with its output at 100 %. The operators changed over to B and back: no difference."}, {"code": "TE-3", "title": "Short of feed with pump A only", "sit": "FRC-100 has been falling slowly for days with pump A running; V100 is now at 100 %. The shift remembers the lazy twin and suspects B's check valve."}, {"code": "TE-4", "title": "Pump crackles and the feed sags", "sit": "The field operator reports a noise like gravel from pump A that has become louder this shift. FRC-100 is slightly low and V100 is opening."}, {"code": "TE-5", "title": "Half the feed after the electricians left", "sit": "Motor A was rewired during the night. This morning the operators put A back on line: the feed is about half of what it should be, V100 is wide open, and A is noisier than usual."}, {"code": "TE-6", "title": "Short of feed and a smell of oil", "sit": "FRC-100 is about 1.4 L/s low with V100 at 100 %. The operators changed over to B: still low. The painters say , 100]}, "LSHH-109": {"u": "%", "desc": "Interface high-high: solvent pumps stop (95 %, shares LT-109)", "r": [0, 100]}, "LSLL-109": {"u": "%", "desc": "Interface low-low: XV-119 closes the extract outlet (5 %, shares LT-109)", "r": [0, 100]}, "PSHH-108": {"u": "bar g", "desc": "Column pressure high-high: unit trip (3.0 bar g)", "r": [0, 4]}, "MARGIN": {"u": "$/h", "desc": "Operating cost rate", "r": [-200, 0]}, "FIC-101": {"u": "kg/h", "desc": "Feed to C-101 (FT-101, Coriolis) → FV-101 (fail closed)", "r": [0, 1600]}, "FFIC-103": {"u": "kg/h", "desc": "Solvent (TCE) to C-101 (FT-103) → FV-103 (fail closed); CAS = ratio to FI-101", "r": [0, 600]}, "TIC-102": {"u": "°C", "desc": "Feed after cooler E-101 → TV-102 chilled water (fail open)", "r": [0, 60]}, "TIC-104": {"u": "°C", "desc": "Solvent after cooler E-102 → TV-104 chilled water (fail open)", "r": [0, 60]}, "SIC-105": {"u": "rpm", "desc": "Rotor speed (motor tachometer SI-105) → VFD output (0–100 % = 0–400 rpm)", "r": [0, 400]}, "PIC-108": {"u": "bar g", "desc": "Column top pressure → PV-108 on the raffinate (fail open)", "r": [0, 5]}, "LIC-109": {"u": "%", "desc": "Interface level in the bottom settler → LV-109 on the extract (fail closed)", "r": [0, 100]}, "HIC-117": {"u": "%", "desc": "Feed supply from the upstream unit into T-101 (0–100 % = 0–2.5 m³/h)", "r": [0, 100]}, "HIC-118": {"u": "%", "desc": "Recovered solvent from the recovery column into D-102 (0–100 % = 0–0.6 m³/h)", "r": [0, 100]}}, "te": [{"code": "TE-1", "title": "Off spec with the rotor at design speed", "sit": "Over the last shift AI-111 has crept from 9 to about 13 wt% (solvent-free). SIC-105 shows 180 rpm, the S/F ratio is 0.35, the feed is at design and nothing else is in alarm. What is wrong?"}, {"code": "TE-2", "title": "Hazy raffinate and a falling extract flow", "sit": "The stripper reports TCE droplets in the raffinate. FI-115 has been falling for ten minutes and PDI-110 has risen. Nobody has touched the controls."}, {"code": "TE-3", "title": "The recovery column says the extract is wet", "sit": "C-103 phones: \"your extract carries a water layer, our column is upset.\" LI-109 reads a steady 50 % and LIC-109 is in AUTO. The raffinate looks normal on AI-111."}, {"code": "TE-4", "title": "Off spec at any rotor speed", "sit": "AI-111 rose above 10 wt% in the last hour. The day shift raised the rotor speed to 200 rpm: a small improvement only. Flows and temperatures are at design."}, {"code": "TE-5", "title": "The mass balance will not close", "sit": "The shift report shows FI-114 + FI-115 about 170 kg/h more than FI-101 + FI-103. PDI-110 and XI-110 are higher than last week and AI-111 is creeping up."}, {"code": "TE-6", "title": "Off spec after a solvent-meter calibration", "sit": "Instruments recalibrated FT-103 yesterday. Today AI-111 is over 10 wt% although FFIC-103 holds its ratio of 0.35 exactly. The feed is at design."}, {"code": "TE-7", "title": "The analyzer says fine, the stripper disagrees", "sit": "To save solvent, the night shift lowered the S/F ratio to 0.31 because AI-111 showed plenty of margin (about 7 wt%). The stripper now complains that its acetone load is higher than usual."}, {"code": "TE-8", "title": "Column pressure creeping up", "sit": "PI-108 has crept from 1.0 to about 1.3 bar g over the last quarter of an hour and PIC-108 output is climbing. Feed and solvent flows are steady."}, {"code": "TE-9", "title": "The rotor keeps getting harder to turn", "sit": "JI-105 was 0.5 kW last week; today it is climbing past 1 kW and the vibration alarm has come in. The process side looks normal."}, {"code": "TE-10", "title": "Warm column after chiller maintenance", "sit": "The rotor was raised to 212 rpm last week to tighten the spec. Since the chiller maintenance this afternoon the raffinate has turned hazy and PDI-110 is in alarm."}, {"code": "TE-11", "title": "Off spec since the turnaround", "sit": "Since the turnaround the raffinate has drifted to 11–12 wt%. The same feed, ratio, rotor speed and temperature gave 9 wt% before. FV-103 now runs more open than it used to."}, {"code": "TE-12", "title": "Flooding after a rate increase", "sit": "Planning asked for 15 % more feed. The shift raised FIC-101 to 1150 kg/h and, to keep the spec, the rotor to 205 rpm. Twenty minutes later the raffinate is hazy and AI-113 is in alarm."}], "cats": ["Feed & process conditions", "Equipment", "Instruments & control", "Utilities & driver", "Downstream / external", "People & procedures"], "pfd": "", "pfdNote": "", "loaded": "2026-10-19", "url": "https://apinans.github.io/CUChemEOTS/RDC%20Acetone%20Extraction%20Ver%201/RDC%20Deck.html", "topic": "MS", "status": "Coming soon", "desc": "Rotating-disc contactor extracting acetone from water", "otsName": "RDC Acetone Extraction Ver 1", "topicName": "Mass transfer", "builtin": true, "catalog": true}, "cu_air_separation_vpsa_ver_1": {"id": "cu_air_separation_vpsa_ver_1", "name": "Air Separation VPSA (V-101A/B)", "src": "VPSA nodeck.html", "tags": {"FI-101": {"u": "Nm³/h", "desc": "Feed air from K-100 (FT-101)", "r": [0, 2500]}, "SI-100": {"u": "%", "desc": "K-100 compressor speed (VSD)", "r": [0, 100]}, "JI-100": {"u": "kW", "desc": "K-100 motor power", "r": [0, 250]}, "PDI-100": {"u": "mbar", "desc": "Air intake filter F-100 pressure drop", "r": [0, 120]}, "PI-115A": {"u": "bar a", "desc": "Adsorber V-101A pressure (PT-115A)", "r": [0, 6]}, "PI-115B": {"u": "bar a", "desc": "Adsorber V-101B pressure (PT-115B)", "r": [0, 6]}, "TI-116A": {"u": "°C", "desc": "Bed A thermocouple, bottom (feed end, 0.6 m)", "r": [0, 50]}, "TI-117A": {"u": "°C", "desc": "Bed A thermocouple, middle (2.9 m)", "r": [0, 50]}, "TI-118A": {"u": "°C", "desc": "Bed A thermocouple, top (product end, 5.2 m)", "r": [0, 50]}, "TI-116B": {"u": "°C", "desc": "Bed B thermocouple, bottom (feed end, 0.6 m)", "r": [0, 50]}, "TI-117B": {"u": "°C", "desc": "Bed B thermocouple, middle (2.9 m)", "r": [0, 50]}, "TI-118B": {"u": "°C", "desc": "Bed B thermocouple, top /* ---------- progress ---------- */
function subFilled(n) {
  const d = P.d[n];
  switch (n) {
    case '0.3': return P.figs.some(f => f.stage === 's0') || P.evidence.some(e => e.initial);
    case '3.4': case '3.6': return P.hyp.length > 0;
    case '3.9': return P.timeline.length > 0;
    case '4.2': return P.evidence.some(e => e.inSdn);
    case '4.3': return P.hyp.some(h => h.sdn && Object.values(h.sdn).some(Boolean));
    case '4.4': return P.hyp.some(h => h.P && h.S && h.T);
    case '4.6': return P.tests.length > 0;
    case '4.7': return P.tests.length > 0 && P.tests.every(t => isFilled(t.kill));
    case '4.8': case '6.4': return P.tests.some(t => num(t.cost) > 0) || P.ledger.length > 0;
    case '5.0': return P.tests.some(t => t.res && (t.res.ds || isFilled(t.res.obs)));
    case '5.3': return Object.keys(P.dscore).length > 0;
    case '2.2': return !!P.sketch;
    case '0.1': return isFilled(d && d.unit);
  }
  return isFilled(d);
}
function stageProg(s) { const t = s.subs.length, f = s.subs.filter(u => subFilled(u.n)).length; return [f, t]; }

/* --- a small reader for JS literals: no code from the OTS is ever executed --- */

    if (c === '/' && t[k + 1] === '*') { k = t.indexOf('*/', k + 2) + 1; if (k <= 0) return -1; continue; }

  for (let k = 0; k < body.length; k++) { const c = body[k];
    if (q) { if (c === '\\') { k++; continue; } if (c === q) q = null; continue; }
    if (c === "'" || c === '"' || c === '`') { q = c; continue; }
    if ('[{('.includes(c)) { depth++; continue; } if (']})'.includes(c)) { depth--; continue; }
    if (depth === 1 && body.startsWith(key, k) && /[\s,{]/.test(body[k - 1]) && /^\s*:/.test(body.slice(k + key.length, k + key.length + 4))) {

function parseOTS(text, fname) {

  const ib = declBlock(text, 'IND', '{');
  if (ib) topItems(ib).forEach(o => { const m = /(['"])([^'"]+)\1\s*:\s*$/.exec(o.pre.trim() + ' ') || /(['"])([^'"]+)\1\s*:/.exec(o.pre); if (!m) return; tags[m[2]] = { u: strField(o.body, 'u'), desc: strField(o.body, 'desc'), r: numPair(o.body, 'r') }; });
  const cre = /\btag\s*:\s*(['"])([^'"]+)\1\s*,\s*desc\s*:\s*(['"])((?:\\.|(?!\3)[^\\])*)\3\s*,\s*unit\s*:\s*(['"])([^'"]*)\5(?:\s*,\s*lo\s*:\s*(-?[\d.]+)\s*,\s*hi\s*:\s*(-?[\d.]+))?/g; let m;
  while ((m = cre.exec(text))) { if (!tags[m[2]]) tags[m[2]] = { u: m[6], desc: unesc(m[4]), r: m[7] != null ? [+m[7], +m[8]] : null }; }

/* --- OTS from a web link --- */
async function packFromURL(raw) {
  raw = String(raw || '').trim(); if (!raw) { toast('Paste the OTS web link first'); return; }
  let abs; try { abs = new URL(/^[a-z]+:\/\//i.test(raw) || raw.startsWith('/') || raw.startsWith('.') ? raw : (/^[\w-]+(\.[\w-]+)+\//.test(raw) ? 'https://' + raw : raw), location.href).href; } catch (e) { toast('That is not a valid link'); return; }
  toast('Reading ' + abs + ' …');
  let text = null, pk = null; try { const r = await fetch(abs, { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) { }
  const leaf = decodeURIComponent(abs.replace(/[?#].*$/, '').replace(/\/$/, '/index.html').split('/').pop() || abs);
  if (text) { pk = parseOTS(text, leaf); if (!pk.te.length && !Object.keys(pk.tags).length) pk = null; }
  if (!pk) {
    if (!confirm('The page could not be read from here (the site may block reading by other pages, need a sign-in, or there is no internet).\n\nKeep it as a link only? Students can still open the OTS from the workbook. Load the OTS file to get its cases and tags.')) return;
    const host = abs.replace(/^https?:\/\//, '').replace(/[?#].*$/, '');
    pk = { id: 'ots_link_' + host.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(-40), name: (host.split('/').filter(s => s && !/\.html?$/i.test(s)).slice(1).pop() || host.split('/')[0]).replace(/[_-]+/g, ' '), tags: {}, te: [], cats: GENERIC_CATS.slice(), pfd: '', loaded: today() };
  }
  pk.url = abs; pk.src = abs;
  const keep = PACKS[pk.id]; if (keep && keep.pfd) pk.pfd = keep.pfd; if (keep && keep.cats) pk.cats = keep.cats;
  const note = pk.hasKeys ? ' (instructor edition: answer keys were ignored)' : '';
  delete pk.hasKeys; PACKS[pk.id] = JSON.parse(JSON.stringify(pk)); setPack(pk); libSave(P.pack); touch(); rerender();
  toast(pk.te.length || Object.keys(pk.tags).length ? `${pk.name}: ${pk.te.length} cases, ${Object.keys(pk.tags).length} tags from the link${note}` : 'Link kept — open it from “OTS (live)”');
}

function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; } else f += c; }
  if (f !== '' || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.length > 1 || (r[0] || '').trim() !== '');
}
function makeDataset(name, text) {

  if (!rows.length) throw new Error('empty file');
  const head = rows[0].map(h => h.trim()), body = rows.slice(1), lc = head.map(h => h.toLowerCase());
  const base = { id: uid('ds'), name, label: name.replace(/\.csv$/i, ''), meta, role: '', added: new Date().toISOString() };
  if (lc.includes('type') && lc.includes('message')) {
    const it = lc.indexOf('time_s'), iy = lc.indexOf('type'), im = lc.indexOf('message');
    return Object.assign(base, { kind: 'log', log: body.map(r => ({ t: num(r[it]), type: r[iy], msg: r[im] })) });
  }
  if (lc.includes('tag') && (lc.includes('value_now') || lc.includes('value'))) {
    const g = k => lc.indexOf(k), iT = g('tag'), iU = g('unit'), iN = g('value_now') >= 0 ? g('value_now') : g('value'), iD = g('value_design'), iV = g('deviation');
    return Object.assign(base, { kind: 'snapshot', snap: body.map(r => ({ tag: r[iT], unit: iU >= 0 ? r[iU] : '', now: num(r[iN]), design: iD >= 0 ? num(r[iD]) : NaN, dev: iV >= 0 ? num(r[iV]) : (iD >= 0 ? num(r[iN]) - num(r[iD]) : NaN) })) });

}

Object.assign(ACT, {

    const z = r => Math.abs(num(r.now) - num(r.normal)) / Math.max(Math.abs(num(r.normal)) * 0.02, 0.05); rows.sort((a, b) => z(b) - z(a));
    D(e.dataset.n)[e.dataset.k] = rows.slice(0, 10); touch(); rerender(); toast('Ten largest deviations filled — delete rows you do not need'); }
});

function wireSketch() {

  return `<p class="kicker">Outputs</p><h1>Save, report, present</h1><p class="note">${tot[0]} of ${tot[1]} sub-steps filled · ${P.evidence.length} evidence lines · ${P.hyp.length} hypotheses · ${P.tests.length} plant tests · ${P.figs.length} figures</p>
  <div class="g3" style="margin-top:12px">
   <div class="out-card"><h3>Project file</h3><p class="note">Everything — answers, OTS data, figures, sketch — in one <b>.woods.json</b> file. Open it later on any computer to continue. <span class="thg">บันทึกไฟล์โครงการเพื่อทำต่อภายหลัง</span></p>
    <div class="row"><button class="btn pri" data-act="save">Save</button><button class="btn" data-act="saveas">Save as…</button><button class="btn" data-act="open">Open…</button><button class="btn red" data-act="reset">⟲ Reset / start over</button></div></div>
   <div class="out-card"><h3>Report (Word)</h3><p class="note">A .docx with every filled sub-step, tables and figures, in the order of the six stages. <span class="thg">รายงาน Word ตามลำดับ 6 ขั้น ตัดคำไทยด้วยตัวแบ่งที่มองไม่เห็น</span></p>
    <div class="fld"><label>Font</label><select id="rFont"><option value="sarabun">TH Sarabun New 16 pt (Thai + English)</option><option value="calibri">Calibri 11 pt (English)</option></select></div>
    <label class="chk"><input type="checkbox" id="rEmpty"> include empty sub-steps (as “not completed”)</label>
    <div class="row"><button class="btn pri" data-act="docx">Download Word report</button><button class="btn" data-act="printrep">Printable report / PDF</button></div></div>
   <div class="out-card"><h3>Presentation</h3><p class="note">A 16:9 HTML slide deck built from your work: case, evidence, IS/IS NOT, statement, fishbone, hypotheses, S/D/N, test plan, results, root cause, fix, look-back. Arrow keys to move; Print → PDF. <span class="thg">สไลด์นำเสนอ 16:9 สร้างจากงานของทีม</span></p>
    <div class="row"><button class="btn pri" data-act="deck">Download slides (.html)</button><button class="btn" data-act="deckview">Preview</button></div><p class="note" data-dv="nslides"></p></div>
  </div>
  <div class="out-card" style="margin-top:14px"><h3>Readiness check</h3>${STAGES.map(s => { const keys = s.subs.filter(u => u.key), miss = keys.filter(u => !subFilled(u.n));
    return `<div class="ck ${miss.length ? '' : 'ok'}" style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span class="b"></span><span><b>${s.no === 'R' ? '' : 'Stage ' + s.no + ' '}${esc(s.name)}</b> ${miss.length ? `<span class="note">— still empty: ${miss.map(u => `<a data-act="gosub" data-s="${s.id}" data-v="sub-${u.n}" style="cursor:pointer;color:var(--blue)">${u.n}</a>`).join(', ')}</span>` : '<span class="note">— deliverable complete</span>'}</span></div>`; }).join('')}</div>`;
}
DV.nslides = () => deckSlides().length + ' slides from the current project.';
Object.assign(ACT, {
  docx: async () => { toast('Building the Word report…'); try { const b = await buildDocx({ font: $('#rFont').value, empty: $('#rEmpty').checked }); download(fileName('_report.docx'), b); } catch (e) { console.error(e); toast('Report failed: ' + e.message); } },
  printrep: () => { const h = reportHTML(), w = window.open('', '_blank'); if (w) { w.document.open(); w.document.write(h); w.document.close(); setTimeout(() => { try { w.focus(); w.print(); } catch (e) { } }, 900); } else download(fileName('_report.html'), new Blob([h], { type: 'text/html' })); },
  deck: () => download(fileName('_slides.html'), new Blob([deckHTML()], { type: 'text/html' })),
  deckview: () => { const w = window.open('', '_blank'); if (w) { w.document.open(); w.document.write(deckHTML()); w.document.close(); } else download(fileName('_slides.html'), new Blob([deckHTML()], { type: 'text/html' })); },
  gosub: e => go(e.dataset.s, e.dataset.v)
});
boot();

</script>
</body>
</html>
